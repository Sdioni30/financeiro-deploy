services:

  db:
    image: mysql:8
    container_name: financeiro-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_financeiro
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  backend:
    image: ghcr.io/sdioni30/financeiro-backend:latest
    container_name: financeiro-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/db_financeiro
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7200000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://controlefinanceiro.projetcsdioni.online}
    networks:
      - internal
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    image: ghcr.io/sdioni30/financeiro-frontend:latest
    container_name: financeiro-frontend
    restart: unless-stopped
    networks:
      - internal
      - public
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  proxy:
    image: caddy:2-alpine
    container_name: caddy-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data    
      - caddy_config:/config
    networks:
      - internal
      - public
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 300 --label-enable
    environment:
      - WATCHTOWER_CLEANUP=true

volumes:
  db_data:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  public: