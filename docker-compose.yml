services:

  db:
    image: mysql:8
    container_name: financeiro-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_financeiro
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  backend:
    build: ./backend/financeiro
    container_name: financeiro-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/db_financeiro
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7200000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      APP_CONTAS_LIBERADAS: ${APP_CONTAS_LIBERADAS:-sdioni30@gmail.com}
    ports:
      - "8080:8080"
    networks:
      - default
      - internal

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: financeiro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - default
      - internal

volumes:
  db_data:

networks:
  internal:
    external: true
    name: financeiro-deploy_internal