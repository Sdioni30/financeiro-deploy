services:

  db:
    image: mysql:8
    container_name: financeiro-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: db_financeiro
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ghcr.io/sdioni30/financeiro-backend:latest
    container_name: financeiro-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/db_financeiro
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7200000}
    ports:
      - "8080:8080"

  frontend:
    image: ghcr.io/sdioni30/financeiro-frontend:latest
    container_name: financeiro-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  db_data:
